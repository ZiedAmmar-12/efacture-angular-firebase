<div class="row">
    <div class="content mt-2">
    <div class="col-xs-12" style="background-color:rgb(113, 218, 222)"> 
  
        <h1 class="modal-title" style="background-color:rgb(113, 218, 222)">Facture</h1>
        <form class="form-horizontal" [formGroup]="FactureFormedit" (ngSubmit)="onUpdateFactureedit(FactureFormedit)" *ngIf="this.nomsocietedata?.id"> 
            <div class="row">
                <div class="col-md-6">

                    <div class="form-group">
                        <label for="idsociete"> <h6>Nom société </h6> </label> 
                        <input type="hidden" class="form-control" name="idsociete" formControlName="idsociete" value="{{facture?.idsociete}}">
                         : {{this.nomsocietedata.nomsociete}}
                    </div>
    
                <br><hr>
    
                    <div class="form-group">
                        <label for="idclient"> <h6>Nom client </h6> </label> 
                        <select  class="form-control" id="idclient" formControlName="idclient">
                            <option *ngFor="let client of clientdata ; let i= index " value="{{client.id}}">{{client.nomclient}}</option>
                        </select>
                    </div>

                    <br><hr>
                    <div class="form-group">
                        <label for="type_dev_fac"><h6>Type de devise de facture </h6></label>
                        <select  class="form-control" name="type_dev_fac" (change)="selecteddeviseoption()" formControlName="type_dev_fac">
                            <option  value="TND">TND</option>
                            <option  value="Euro"> EURO</option>   
                        </select>
                    </div>
    
                </div>
                <div class="col-md-6">
    
                    <div class="form-group">
                        <label for="numfacture"> <h6>Numéro facture </h6> </label> : {{this.numfacturedata}}
                        <input type="hidden" class="form-control" name="numfacture" formControlName="numfacture" value="{{facture?.numfacture}}">
                    </div>
    
                <br><hr>

                    <div class="form-group">
                        <label for="date_valid_fact"> <h6>Date validité de facture </h6> </label><br> 
                        <input type="date" class="form-control" name="date_valid_fact" formControlName="date_valid_fact" value="{{facture?.date_valid_fact}}">
                    </div>
    
                <br><hr>
                <br>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                <br>
                <h2>Information additionnelles</h2>
                <hr>
                <div class="col-md-12 text-right">
                    <button type="button" class="btn btn-primary" (click)="addrefrenceFormGroup()">Ajouter</button>
                    &nbsp;
                    <button type="button" class="btn btn-success" (click)="calculertotal()">Calculer</button>
                </div> <br>  

                <div formArrayName="references">

                    
                    
                    <table class="table align-middle mb-0 bg-white">
                        <thead class="bg-light">
                        <tr>
                            <th>Réf</th>
                            <th>Description</th>
                            <th>Quantité</th>
                            <th>Prix unitaire HT</th>
                            <th>Montant HT</th>
                            <th>Action</th>
                        </tr>
                      
                        </thead>
                        <tbody>
                        <ng-container *ngFor="let refrenceform of referencesforms.controls let i = index;" >
                        <tr [formGroupName]="i">    
    
                            <td> 
                                {{i+1}}
                                <input type="hidden" class="form-control" [id]="'refid' + i" [value]="i+1" formControlName="refid">
                            </td>
                            
                            <td>
                                <input type="textarea" class="form-control" [id]="'description' + i" formControlName="description">
                            </td>
                            
                            <td> 
                                <input type="number" class="form-control" [id]="'quantite' + i" formControlName="quantite">
                            </td>
                            
                            <td> 
                                <input type="number" class="form-control" [id]="'prix_unitaire_HT' + i" formControlName="prix_unitaire_HT">
                            </td>
                            <td> 
                                <input type="number" class="form-control" [id]="'montant_HT' + i"  formControlName="montant_HT">
                            </td>
                            <td>
                                <button *ngIf="i !=0"
                                class="btn btn-danger mt-4"
                                type="button"
                                (click)="deletereferenceFormGroup(i)"
                              >
                                Delete
                              </button>
                            </td>
                        </tr>
                        </ng-container>
                        </tbody>
                    </table>
                    
                </div>
                

                <table class="table align-middle mb-0 bg-white">
                    <tbody>
                    <tr>
                        <td colspan="3"></td>
                        <th>Total HT</th>
                        <td> 
                            <input type="number" class="form-control" id="totalht" name="totalht" value="{{facture?.totalht}}" formControlName="totalht">
                        </td>
                        <td></td>
                    </tr>
                    <tr>
                        <th></th>
                        <th>Option TVA </th>
                        <td> 
                            <select  class="form-control" id="optiontva" formControlName="optiontva" (change)="selecteoptiontva()">
                                <option value="0"> aucun </option>
                                <option value="19"> 19% </option>
                                <option value="20"> 20% </option>
                            </select>

                        </td>
                        <th>TVA</th>
                        <td> 
                            <input type="number" class="form-control" id="tva" value="{{facture?.tva}}"  formControlName="tva">
                        </td>
                       
                    </tr>
                    <tr *ngIf="this.typedevfac =='TND'">
                        <th colspan="3"></th>
                        <th>Timbre fiscal</th>
                        <td>
                            <input type="number" class="form-control" id="timbrefiscal"  value="{{facture?.timbrefiscal}}" formControlName="timbrefiscal">
                        </td>
                    </tr>
                    <tr>
                        <th colspan="3"></th>
                        <th>Total TTC</th>
                        <td> 
                            <input type="number" class="form-control" id="totalttc" value="{{facture?.totalttc}}" formControlName="totalttc">
                        </td>
                    </tr>
                    </tbody>
                </table>
                <br>
                
                <div class="modal-footer"> 
  
                    <button class="btn btn-success" type="submit" [disabled]="FactureFormedit.invalid" >Editer</button>
                    &nbsp;
                    <button class="btn btn-primary" (click)="onBack()" >Retour</button>
    
                </div>  
                <br>
                </div>
            </div>
            <br><br>
            <input type="hidden" class="form-control" id="timbrefiscal" *ngIf="this.typedevfac=='Euro'|| this.typedevfac==''" formControlName="timbrefiscal" value="0">
        </form>
                     
    </div>
    </div>
  </div>
  <br><br>

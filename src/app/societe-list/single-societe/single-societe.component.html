<div class="content mar pp mt-2" >
  <h4 class="">{{'Company details'|translate}}</h4>
  
<div class="col-xs-12 px-4 py-4" style="background-color:rgb(242, 245, 245) ">
  <div class="form-group col-md-6 " >
    <img [src]="imageUrl" width="50%" height="50%"/>
  </div>
        <div class="row">
        <div class="form-group col-md-6">
            <label for="nomsociete"> <h6>{{'Company Name'|translate}}: {{ societe?.nomsociete }}</h6> </label>    
        </div>
        
        <div class="form-group col-md-6">
            <label for="siret"> <h6>{{'Siret company'|translate}}: {{ societe?.siret }}</h6> </label>  
        </div>
        <div class="form-group col-md-6">
          <label for="adresse"> <h6>{{'Company address'|translate}}: {{ societe?.adresse }}</h6> </label>  
        </div>
        <div class="form-group col-md-6">
          <label for="codepostale"> <h6> {{'Company postal code'|translate}}: {{ societe?.codepostale }}</h6> </label> 
        </div>
        <div class="form-group col-md-6">
          <label for="pays"> <h6>{{'Company country'|translate}}: {{ societe?.pays }}</h6> </label> 
        </div>
        <div class="form-group col-md-6">
          <label for="directeur"> <h6>{{'Name Company Director'|translate}} : {{ societe?.directeur }}</h6> </label> 
        </div>
        <div class="form-group col-md-6">
            <label for="telephone"> <h6>{{'Company telephone number'|translate}}: {{ societe?.telephone }}</h6> </label>   
        </div>
        <div class="form-group col-md-6">
            <label for="email"> <h6>{{'Company email'|translate}}: {{ societe?.email }}</h6> </label> 
        </div>
        <div class="form-group col-md-6">
          <label for="siteweb"> <h6> {{'Company website'|translate}}: {{ societe?.siteweb }}</h6> </label>   
        </div>
        <div class="form-group col-md-6">
          <label for="type_dev_fac"> <h6> {{'Currency Type'|translate}}: {{ societe?.type_dev_fac }}</h6> </label> 
        </div>
        
        <div class="form-group col-md-6">
          <label for="optiontva"> <h6> {{'VAT'|translate}}: {{ societe?.optiontva }}%</h6> </label> 
        </div>
        <div class="form-group col-md-6">
          <label for="etat"> <h6> {{'Company State'|translate}}: {{ societe?.etat }}</h6> </label> 
        </div>
        <div class="form-group col-md-6">
          <label for="idcategorie"> <h6>{{'Category'|translate}}: {{  nomcategoriedata.nomcategorie}}</h6> </label> 
        </div>
        
</div>
      <h1 class="">{{'Banking details'|translate}}</h1>
      <div class="row">
        <div class="form-group col-md-6">
            <label for="nombanque"> <h6> {{'Bank name'|translate}}: {{ societe?.nombanque }}</h6> </label>      
        </div>
        <div class="form-group col-md-6">
            <label for="codebanque"> <h6> {{'Bank code'|translate}}: {{ societe?.codebanque }}</h6> </label>    
        </div>
        <div class="form-group col-md-6">
          <label for="numcompte"> <h6>{{'Account number'|translate}}: {{ societe?.numcompte }}</h6> </label> 
        </div>
        <div class="form-group col-md-6">
            <label for="swift"> <h6>{{'Swift'|translate}}: {{ societe?.swift }}</h6> </label>     
        </div>
      </div>
      <h1 class="">{{'Date'|translate}} </h1>
      <div class="row">
        <div class="form-group col-md-6">
          <label for="datecreation"><h6>Date creation :</h6> </label> 
          {{ societe?.datecreation | date :'dd/MM/YYYY H:m:s' }} 
        </div>
        <div class="form-group col-md-6">
            <label for="datemodification"><h6>Date modification :</h6> </label> 
            {{ societe?.datemodification | date :'dd/MM/YYYY H:m:s' }} 
        </div>
      </div>
    <div class="modal-footer"> 
      <button class="btn btn-primary" (click)="onBack()" >Retour</button>
    </div>    
</div>

<div class="row mar">
  <div class="content mt-2 px-4">
  <div class="col-xs-12">

      <h1 class=""> {{'Edit Customer'|translate}}</h1> 
      <form class="form-horizontal" [formGroup]="ClientFormedit" (ngSubmit)="onUpdateClientedit(ClientFormedit)"> 

        <div class="row" >

            <div class="form-group col-md-6">
                <label for="nomclient"> <h6>{{'Name client'|translate}}</h6> </label> <br>
                <input type="text" class="form-control" name="nomclient" formControlName="nomclient" value="{{client?.nomclient}}">
            </div>

          <br>

            <div class="form-group col-md-6">
                <label for="tel"> <h6>{{'Mobile'|translate}} </h6> </label> 
                <input type="phoneNumber" class="form-control" name="telephone" formControlName="telephone" value="{{client?.telephone}}">
            </div>

          <br>

            <div class="form-group col-md-6">
                <label for="email"> <h6>{{'Customer address'|translate}} </h6> </label><br> 
                <input type="email" class="form-control" name="email" formControlName="email" value="{{client?.email}}">
            </div>

          <br>

            <div class="form-group col-md-6">
                <label for="siren"><h6>{{'Siren client'|translate}} </h6> </label> 
                <input type="text" class="form-control" name="siren" formControlName="siren" value="{{client?.siren}}">
            </div>

          <br>

            <div class="form-group col-md-6">
              <label for="nomgerant"><h6>{{'Manager name'|translate}}</h6> </label> 
              <input type="text" class="form-control" name="nomgerant" formControlName="nomgerant" value="{{client?.nomgerant}}">
            </div>

          <br>  

            <div class="form-group col-md-6">
              <label for="adresse"> <h6>{{'Customer address'|translate}} :</h6> </label> <br>
              <input type="text" class="form-control" name="adresse" formControlName="adresse" value="{{client?.adresse}}">
            </div>

          <br>
          
          <div class="modal-footer "> 

            <button class="btn btn-success" type="submit">{{'Update'|translate}}</button>
            &nbsp;
            <button class="btn btn-primary" (click)="onBack()" >{{'Back'|translate}}</button>

          </div>  
          <br>
        </div>    
        <br><br><br>

      </form>         
  </div>
  </div>
</div>

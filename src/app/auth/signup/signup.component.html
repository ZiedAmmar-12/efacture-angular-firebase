<div class="accueil">

  <div class="d-flex">
    <div class=" division1" >
      <div class="row  ">
        <div >
        <ul class="navbar-nav  selectLang ms-3">
          <li class="nav-item">
              
              <select class="form-select" (change)="ChangeLang($event)" name="" id="">
                  <option [selected]="lang==='en'" value="en">En</option>
                  <option [selected]="lang==='fr'" value="fr">Fr</option>
                  <option [selected]="lang==='ar'" value="ar">Ar</option>
              </select>
          </li>
          </ul>
         </div>
        <div class="">
          <img src="../../../assets/images/connexion.png" class="img-f" alt="Sample image">
        </div>
  
        
      </div>
    </div>
    <div class=" division " >
      <div class=" bgForm mt-4">
        <form [formGroup]="signUpForm" (ngSubmit)="signUpOnsubmit()">
           
          <div class="text-center mt-4 pt-2">
          
            <span ><a routerLink="/auth/signin" class="btnCnx">{{'Log in'|translate}}</a></span>
            <span><a routerLink="/auth/signup" class="btnCnx">{{'Register'|translate}}</a></span>
          </div>
          
            <h4 class="bienvenue mt-4">{{'WELCOME'| translate}}</h4>
          <div class="bg my-4">
            <p class="  mt-2 pt-1 mb-0 text-center">{{'Create an account'|translate}}</p>
          </div>
  
      
          <div class="form-outline mb-4 mx-4 mt-4">
            <label class="form-label" for="userName">{{'userName'|translate}}</label>
            <input type="text" id="userName" class="form-control  inputcnx" placeholder="Enter a valid nom {{'userName'|translate}}"  name="userName" formControlName="userName"/>
            
          </div>
         
          <div class="form-outline mb-4 mx-4 mt-4">
            <label class="form-label" for="email">{{'Email address'|translate}}</label>
            <input type="email" id="email" class="form-control  inputcnx" placeholder="{{'Enter Email address'|translate}}"  name="email" formControlName="email"/>
          </div>
  
        
          <div class="form-outline mb-4 mx-4 mt-4">
            <label class="form-label" for="password">{{'Password'|translate}}</label>
            <input type="password" id="password" name="password" class="  form-control inputcnx"
              placeholder="{{'Enter password'|translate}}"  formControlName="password"/>
            
          </div>
      
         
          <p class="text-danger">{{errorMessage}} </p>
          <div class=" form-outline mb-4 mx-4 mt-4 ">
           
          
            <button class=" btncnx" type="submit" [disabled]="signUpForm.invalid">{{'Create an account'|translate}}</button>
  
            <button class=" btncnx mt-2" (click)="onBack()" >{{'Back'|translate}}</button>
          </div>
  
        
  
        </form>
      
    </div>
    
    </div>
  
  </div>
  </div>

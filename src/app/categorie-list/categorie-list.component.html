

 <!-- ======================= Cards ================== -->
 <div class=" ">
    <div class="accueil">
    <div class="col-md-12">
    <h4 class="">{{'Category List'|translate}}</h4>
   <div class="cardBox">
    <div class="card">
        <div>
            <div class="numbers">2000£</div>
            <div class="cardName">Revenus Total</div>
        </div>

        <div class="iconBx">
            
        </div>
    </div>

    <div class="card">
        <div>
            <div class="numbers">1000</div>
            <div class="cardName">Factures </div>
        </div>

        <div class="iconBx">
           
        </div>
    </div>

    <div class="card">
        <div>
            <div class="numbers">284</div>
            <div class="cardName">Comments</div>
        </div>

        <div class="iconBx">
            
        </div>
    </div>

    
</div>

<div class="details mt-4 ">
    <div class="recentOrders">
      <div class="cardHeader">
        <form class="search">
          <input class="form-control " type="search" placeholder="{{'Search'|translate}}">
        </form>
       <div>
        <button class="btn btn-primary" (click)="onNewCategorie()">{{'Add'|translate}}</button>
        &nbsp;
        <button class="btn btn-primary "  (click)="exportexcel()">{{'Export to Excel'|translate}}</button> 
       </div>
        </div>

    <hr>

            
        <div class="tab">
            <table class="" id="excel-table">
                <thead class="">
                <tr>
                    <th>{{'Name Category'|translate}}</th>
                    
                    <th>{{'Actions'|translate}}</th>
                    
                </tr>
                </thead>
                <tbody >
                <tr *ngFor="let categorie of searchCategories | paginate: {
                    itemsPerPage: pageSize,
                    currentPage: page,
                    totalItems: count
                    }; let i= index " >

                    
                    <td>
                        
                        {{ categorie?.nomcategorie}}
                    </td>
                  
                    <td>
                        <span style="color: rgb(13, 161, 229);">
                            <i-bs name="eye"
                                width="25"
                                height="30" 
                                (click)="onViewCategorie(categorie.id)">
                            </i-bs>
                        </span>  

                        &nbsp;

                        <span style="color: rgb(22, 109, 222);">
                            <i-bs name="pencil-square"
                                width="20"
                                height="30" 
                                (click)="oneditCategorie(categorie.id)">
                            </i-bs>
                        </span>   

                        &nbsp;

                        <span style="color: red; ">
                            <i-bs name="archive-fill"
                                width="18"
                                height="30"
                                (click)="onDeleteCategorie(categorie.id)" >
                            </i-bs>  
                        </span>         
                    </td>
                </tr>
                
                </tbody>
            </table>
        </div> 
        <br>
                <div class="row">
                        <div class="col-md-6">
                            <pagination-controls
                                previousLabel="{{'Prev'|translate}}"
                                nextLabel="{{'Next'|translate}}"
                                [responsive]="true"
                                (pageChange)="handlePageChange($event)"
                                >
                            </pagination-controls>
                        </div>
                        
                        <div class="col-md-6">
                            <strong> {{'Element per page'|translate}}:</strong>
                            <select (change)="handlePageSizeChange($event)" >
                                <option *ngFor="let size of pageSizes" [ngValue]="size">
                                    {{size}}
                                </option>
                            </select>
                        </div>
                </div>

            
           
                
</div>
</div>
</div>
</div>
</div>

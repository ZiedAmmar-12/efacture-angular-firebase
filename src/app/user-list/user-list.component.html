
    <div class="container-xxl position-relative  d-flex p-0">
        <div class=" mt-2 px-4">

            <h4 class="size">{{'List of utilities'|translate}}</h4>
            

          
            
           
        <div class="cardBox">
            <div class="card">
                <div >
                    <div class="numbers">2000£</div>
                    <div class="cardName">Revenus Total</div>
                </div>
        
                <div class="iconBx">
                    
                </div>
            </div>
        
            <div class="card">
                <div>
                    <div class="numbers">1000</div>
                    <div class="cardName">Factures </div>
                </div>
        
                <div class="iconBx">
                   
                </div>
            </div>
        
            <div class="card">
                <div>
                    <div class="numbers">284</div>
                    <div class="cardName">Comments</div>
                </div>
        
                <div class="iconBx">
                    
                </div>
            </div>
        
            
        </div>
        

          
                <div class="details mt-4 ">
                    <div class="recentOrders">
                      <div class="cardHeader">
                        <form class="search">
                          <input class="form-control " type="search" placeholder="{{'Search'|translate}}">
                        </form>
                       <div>
                        <button class="btn btn-primary" (click)="onNewUser()">{{'Add'|translate}}</button>
                        <button *ngIf="userGid === 24" class="btn btn-primary">Ajouter un Manager</button>
                        <button *ngIf="userGid === 24 || userGid === 23" class="btn btn-primary">Ajouter un Agent</button>

                        &nbsp;
                        <button class="btn btn-primary btn-xs" (click)="exportexcel()">{{'Export to Excel'|translate}}</button> 
                       </div>
            </div>
            <hr>
            

        
          <div class="tab">
            <table class="" id="excel-table">
                <thead class="">
                    <tr>
                        <th>{{'userName'|translate}}</th>
                        <th>{{'User Role'|translate}}</th>
                        <th>{{'User State'|translate}}</th>
                        <th>{{'Actions'|translate}}</th>
                        
                    </tr>
                    </thead>
                    <tbody >
                    <tr *ngFor="let user of searchUsers | paginate: {
                        itemsPerPage: pageSize,
                        currentPage: page,
                        totalItems: count
                        }; let i= index " >

                        
                        <td>
                            
                            {{ user?.nomdutilisateur }}
                        </td>
                        
                        <td>
                        <span *ngIf="user?.gid == 22" >Agent facture</span>
                        <span *ngIf="user?.gid == 23" >Manager</span>
                        <span *ngIf="user?.gid == 24" >Admin</span>
                        </td>
                        
                        <td>
                            
                        <span class="text-success" *ngIf="user?.etat == true">Actif</span>  
                        <span class="text-danger" *ngIf="user?.etat == false">Non Actif</span>    
        
                        </td>
                        <td>

                            <span style="color: rgb(13, 161, 229);">
                                <i-bs name="eye"
                                    width="20"
                                    height="30" 
                                    (click)="onViewUser(user.id)">
                                </i-bs>
                            </span>   

                            &nbsp;

                            <span style="color: rgb(22, 109, 222);">
                                <i-bs name="pencil-square"
                                    width="20"
                                    height="30" 
                                    (click)="oneditUser(user.id)">
                                </i-bs>
                            </span>                        
                            
                            &nbsp;

                            <span style="color: red; ">
                                <i-bs name="archive-fill"
                                    width="20"
                                    height="30"
                                    (click)="onDeleteUser(user.id)">
                                </i-bs>  
                            </span>

                                        
                        </td>
                    </tr>
                    
                    </tbody>
                </table>

                
                
            </div>
            <div class="row">
                            <div class="col-md-6">
                                <pagination-controls
                                    previousLabel="{{'Prev'|translate}}"
                                    nextLabel="{{'Next'|translate}}"
                                    [responsive]="true"
                                    (pageChange)="handlePageChange($event)"
                                    >
                                </pagination-controls>
                            </div>
                            
                            <div class="col-md-6">
                                <strong>{{'Element per page'|translate}}:</strong>
                                <select (change)="handlePageSizeChange($event)" >
                                    <option *ngFor="let size of pageSizes" [ngValue]="size">
                                        {{size}}
                                    </option>
                                </select>
                            </div>
            </div>

           
        </div>
